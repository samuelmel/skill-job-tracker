[project]
name = "vaya-indexer"
version = "0.1.0"
description = "Job Board Indexer - Fase 1: fundacao, conector Greenhouse e ingestao"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "starlette>=0.37",
    "duckdb>=2.0.1",
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "pyarrow>=26.0.1",
]

[project.optional-dependencies]
# Conectores que exigem JavaScript (BrowserFetcher). Depois: uv run playwright install chromium
browser = ["playwright>=1.45"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pgserver>=0.1.4",
]

[project.scripts]
vaya = "vaya_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaya_indexer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: testes que acessam a rede real (pytest -m live)",
    "integration: testes com PostgreSQL real",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml.*", "playwright.*", "pyarrow.*"]
ignore_missing_imports = true
